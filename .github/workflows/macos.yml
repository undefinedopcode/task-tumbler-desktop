# Keeps the macOS build honest: builds the app and runs the tests on an
# Apple Silicon runner. The KDE libraries are built once and cached.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # The UI (webui/) is built by CMake with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Homebrew packages
        run: brew install qt qtkeychain openssl@3 libical gettext ninja

      - name: Cache key
        id: key
        run: echo "qt=$(brew list --versions qt | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore KDE libraries
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/kde-deps
          key: kde-deps-${{ steps.key.outputs.qt }}-${{ hashFiles('.github/scripts/build-kde-deps.sh') }}

      - name: Build KDE libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-kde-deps.sh "$HOME/kde-deps"

      # Saved straight away, so a failure further on doesn't mean building them again.
      - name: Save KDE libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/kde-deps
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$HOME/kde-deps;$(brew --prefix)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: .github/scripts/package-macos.sh build "$HOME/kde-deps" dist

      # The packaged app, on the real (Cocoa) platform, in sandboxed
      # screenshot mode: proof it starts, and a look at it without a Mac.
      - name: Screenshots
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          mkdir -p shots
          APP="dist/Task Tumbler.app/Contents/MacOS/task-tumbler"
          DB="$RUNNER_TEMP/shots.db"
          shot() { # name page [args...]
            local name="$1" page="$2"
            shift 2
            TUMBLER_SCREENSHOT="$PWD/shots/$name.png" TUMBLER_PAGE="$page" TUMBLER_SHOT_SIZE=1100x800 \
              "$APP" --db "$DB" "$@" > "shots/$name.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
            kill "$pid" 2>/dev/null || true
            wait "$pid" || echo "$name: exit $?"
            test -s "shots/$name.png" || { echo "no screenshot of $name"; cat "shots/$name.log"; exit 1; }
          }
          # Something on the cards: tasks ready to start, and a routine.
          shot seed1 today --add "Draft the quarterly report ~45m !high #work"
          shot seed2 today --add "Renew passport ~20m"
          shot seed3 today --add "Water the plants daily"
          rm -f shots/seed*
          for page in today tasks schedule notes settings closeout; do shot "$page" "$page"; done
          # Dark, and quick capture (saved as today-capture-quick-capture.png).
          for page in today schedule; do TUMBLER_COLOR_SCHEME=dark shot "$page-dark" "$page"; done
          shot today-capture "today|capture"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Task-Tumbler-macOS
          path: dist/Task-Tumbler-macOS.zip

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
