# Keeps the macOS build honest: builds the app and runs the tests on an
# Apple Silicon runner. The KDE libraries are built once and cached.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew packages
        run: brew install qt qtkeychain openssl@3 libical gettext qrencode libdmtx zxing-cpp ninja

      - name: Cache key
        id: key
        run: echo "qt=$(brew list --versions qt | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore KDE libraries
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/kde-deps
          key: kde-deps-${{ steps.key.outputs.qt }}-${{ hashFiles('.github/scripts/build-kde-deps.sh') }}

      - name: Build KDE libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-kde-deps.sh "$HOME/kde-deps"

      # Saved straight away, so a failure further on doesn't mean building them again.
      - name: Save KDE libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/kde-deps
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$HOME/kde-deps;$(brew --prefix)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: .github/scripts/package-macos.sh build "$HOME/kde-deps" dist

      # The packaged app, on the real (Cocoa) platform, in sandboxed
      # screenshot mode: proof it starts, and a look at it without a Mac.
      - name: Screenshots
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          mkdir -p shots
          for page in today tasks schedule settings closeout; do
            TUMBLER_SCREENSHOT="$PWD/shots/$page.png" TUMBLER_PAGE="$page" TUMBLER_SHOT_SIZE=1100x800 \
              "dist/Task Tumbler.app/Contents/MacOS/task-tumbler" --db "$RUNNER_TEMP/shots.db" > "shots/$page.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
            kill "$pid" 2>/dev/null || true
            wait "$pid" || echo "$page: exit $?"
            test -s "shots/$page.png" || { echo "no screenshot of $page"; cat "shots/$page.log"; exit 1; }
          done

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Task-Tumbler-macOS
          path: dist/Task-Tumbler-macOS.zip

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
